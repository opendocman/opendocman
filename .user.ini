; OpenDocMan PHP settings for PHP-FPM / cPanel servers
; This file is read automatically by PHP-FPM on every request.
; Settings here apply only to this directory and its subdirectories.
; See https://www.php.net/manual/en/configuration.file.per-user.php

file_uploads = On
upload_max_filesize = 100M
post_max_size = 110M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_file_uploads = 20
max_input_vars = 3000
expose_php = Off
allow_url_include = Off
zlib.output_compression = On
zlib.output_compression_level = 6
display_errors = Off
log_errors = On
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Strict"