name: Tests

on:
  push:
  pull_request:

jobs:
  unit-integration:
    name: PHPUnit (unit + integration)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: make test-unit

      - name: Run integration tests
        run: make test-integration

  isolated-unit:
    name: PHPUnit (isolated files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run each unit test file in isolation
        run: |
          set -e
          for f in tests/Unit/*Test.php; do
            php application/vendor/phpunit/phpunit/phpunit -c phpunit.xml.dist "$f" >/dev/null 2>&1 \
              || { echo "ISOLATION FAILURE: $f"; exit 1; }
          done
          echo "All unit test files pass in isolation"

  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Lint all PHP files
        run: |
          set -e
          for f in $(find application scripts tests -name '*.php' -not -path 'application/vendor/*'); do
            php -l "$f" >/dev/null || exit 1
          done
          echo "All PHP files lint clean"